name: OCR Windows Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "internal/ocr/**/*.go"
      - "internal/ocr/models.json"
      - "internal/ocr/winrt.ps1"
      - "resources/ocr/*.onnx"
      - "resources/ocr/ppocr_keys.txt"
      - "resources/windows-amd64/ocr/*.dll"
      - ".gitattributes"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ocr-test.yml"
  push:
    branches: [main]
    paths:
      - "internal/ocr/**/*.go"
      - "internal/ocr/models.json"
      - "internal/ocr/winrt.ps1"
      - "resources/ocr/*.onnx"
      - "resources/ocr/ppocr_keys.txt"
      - "resources/windows-amd64/ocr/*.dll"
      - ".gitattributes"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ocr-test.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Reproduce default Windows line endings
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./internal/ocr/...
      - name: Verify packaged x64 OCR runtime
        env:
          SOTTO_OCR_PREFLIGHT: "1"
        run: go test ./internal/ocr -run '^TestV6SmallRuntimePreflight$' -count=1 -v
