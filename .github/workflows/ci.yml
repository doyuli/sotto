name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      GOARCH: amd64
    steps:
      - name: Reproduce default Windows line endings
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run all tests
        run: go test ./...
      - name: Check native UI usage
        run: bunx mygo vet .
      - name: Verify x64 OCR runtime and models
        env:
          SOTTO_OCR_PREFLIGHT: "1"
        run: go test ./internal/ocr -run '^TestV6SmallRuntimePreflight$' -count=1 -v
      - name: Check desktop smoke tests
        run: go vet -tags e2e ./e2e
      - name: Verify desktop test DPI initialization
        run: go test -tags e2e ./e2e -run '^TestDPIAwarenessAlreadyInitialized$' -count=1 -v
      - name: Build Windows x64 and ARM64 packages
        run: bun run build:win -skip-installer
      - name: Verify packaged Windows OCR assets
        shell: pwsh
        run: |
          foreach ($arch in @("amd64", "arm64")) {
            foreach ($file in @("Sotto.exe", "ocr/det.onnx", "ocr/rec.onnx", "ocr/ppocr_keys.txt",
                               "ocr/onnxruntime.dll", "ocr/onnxruntime_providers_shared.dll", "ocr/LICENSE", "ocr/NOTICE")) {
              if (-not (Test-Path -LiteralPath "build/windows-$arch/$file" -PathType Leaf)) {
                throw "Missing packaged file: windows-$arch/$file"
              }
            }
          }

  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Verify Apple silicon runner
        run: test "$(uname -m)" = arm64
      - name: Run all tests
        run: go test ./...
      - name: Check native UI usage
        run: bunx mygo vet .
      - name: Verify native Vision recognition
        env:
          SOTTO_MACOS_NATIVE: "1"
        run: go test ./internal/ocr -run '^TestVisionNativeSmoke$' -count=1 -v
      - name: Verify isolated pasteboard item round trip
        env:
          SOTTO_MACOS_NATIVE: "1"
        run: go test ./internal/selection -run '^TestMacIsolatedPasteboardItems$' -count=1 -v
      - name: Build the Apple silicon app
        run: bun run build:mac -skip-dmg -skip-notarize
      - name: Verify Windows OCR assets are excluded
        run: test ! -e build/darwin-arm64/Sotto.app/Contents/Resources/ocr
