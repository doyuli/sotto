name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  windows:
    if: github.repository == 'doyuli/sotto'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check version
        run: |
          version=$(bun -p 'require("./package.json").version')
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Expected a stable version and a matching v$version tag." >&2
            exit 1
          fi
      - name: Prepare update notes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "Release $GITHUB_REF_NAME is already published." >&2
              exit 1
            fi
            notes=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
          else
            notes_file=$(mktemp)
            trap 'rm -f "$notes_file"' EXIT
            bunx changelogithub@15.0.5 --github "$GITHUB_REPOSITORY" \
              --to "$GITHUB_REF_NAME" --no-group --no-emoji --output "$notes_file"
            notes=$(sed -E 's/^- \*\*[^*]+\*\*: /- /' "$notes_file")
            printf '%s\n' "${notes:-Sotto $GITHUB_REF_NAME}" > "$notes_file"
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file "$notes_file"
          fi
          # MyGo treats level-two headings as the start of a new version.
          printf '## %s\n\n' "${GITHUB_REF_NAME#v}" > CHANGELOG.md
          printf '%s\n' "${notes:-Sotto $GITHUB_REF_NAME}" | sed -E \
            -e 's/\r$//' \
            -e 's/^## /### /; s/^- \*\*[^*]+\*\*: /- /' \
            -e '/^- /s/[[:blank:]]+&nbsp;-&nbsp;.*$//' \
            -e '/^##### .*\[View changes on GitHub\]\(https?:\/\//d' \
            -e 's/[[:blank:]]*(&nbsp;[[:blank:]]*)+/ /g; s#</?samp>#`#g' \
            -e 's/&lt;/</g; s/&gt;/>/g; s/&quot;/"/g' \
            -e "s/&#39;/'/g" -e 's/&amp;/\&/g' \
            -e 's/^(#{1,6}) +/\1 /' >> CHANGELOG.md
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build signed updates and upload draft
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [[ -z "$MYGO_UPDATER_PUBLIC_KEY" || -z "$MYGO_UPDATER_PRIVATE_KEY" ]]; then
            echo "Configure the updater public key variable and private key secret." >&2
            exit 1
          fi
          bun run build:win -upload

  macos:
    needs: windows
    if: github.repository == 'doyuli/sotto' && vars.SOTTO_MACOS_RELEASE == 'true'
    runs-on: macos-15
    env:
      CGO_ENABLED: "0"
      GH_TOKEN: ${{ github.token }}
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Reuse the draft's update notes
        run: |
          notes_dir="$RUNNER_TEMP/sotto-update-notes"
          mkdir -p "$notes_dir"
          gh release download "$GITHUB_REF_NAME" --pattern update-windows-amd64.json --dir "$notes_dir"
          printf '## %s\n\n' "${GITHUB_REF_NAME#v}" > CHANGELOG.md
          jq -r '.notes // ""' "$notes_dir/update-windows-amd64.json" >> CHANGELOG.md
      - name: Prepare Developer ID and notarization credentials
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}
        run: |
          for name in MACOS_CERTIFICATE MACOS_SIGNING_IDENTITY MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Configure $name before enabling Mac releases." >&2
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/sotto-signing.keychain-db"
          cert="$RUNNER_TEMP/sotto-signing.p12"
          notary_key="$RUNNER_TEMP/sotto-notary.p8"
          keychain_password=$(openssl rand -base64 24)
          umask 077
          printf '%s' "$MACOS_CERTIFICATE" | base64 -D > "$cert"
          printf '%s' "$MACOS_NOTARY_KEY" | base64 -D > "$notary_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -P "$MACOS_CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          xcrun notarytool store-credentials sotto-ci --keychain "$keychain" \
            --key "$notary_key" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID"
          echo "MACOS_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build, notarize and upload Apple silicon Mac artifacts
        env:
          MACOS_NOTARY_PROFILE: sotto-ci
          MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: bun run build:mac -upload
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/sotto-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/sotto-signing.p12" "$RUNNER_TEMP/sotto-notary.p8"
