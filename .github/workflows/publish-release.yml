name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    if: github.repository == 'doyuli/sotto' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read release version
        id: version
        shell: bash
        run: |
          version=$(jq -er '.version | strings' package.json)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable version in package.json in the form X.Y.Z." >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    runs-on: ubuntu-latest
    concurrency:
      group: release-refs/tags/${{ needs.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      SOTTO_MACOS_RELEASE: ${{ vars.SOTTO_MACOS_RELEASE }}
    steps:
      - name: Verify draft and synchronize update notes
        shell: bash
        run: |
          release=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets,body)
          if ! jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and .isDraft and (.isPrerelease | not)' <<< "$release" > /dev/null; then
            echo "$RELEASE_TAG must be an unpublished stable draft." >&2
            exit 1
          fi

          release_body=$(jq -r '.body // ""' <<< "$release")
          notes=$(printf '%s\n' "${release_body:-Sotto $RELEASE_TAG}" | sed -E \
            -e 's/\r$//' \
            -e 's/^## /### /; s/^- \*\*[^*]+\*\*: /- /' \
            -e '/^- /s/[[:blank:]]+&nbsp;-&nbsp;.*$//' \
            -e '/^##### .*\[View changes on GitHub\]\(https?:\/\//d' \
            -e 's/[[:blank:]]*(&nbsp;[[:blank:]]*)+/ /g; s#</?samp>#`#g' \
            -e 's/&lt;/</g; s/&gt;/>/g; s/&quot;/"/g' \
            -e "s/&#39;/'/g" -e 's/&amp;/\&/g' \
            -e 's/^(#{1,6}) +/\1 /')
          version=${RELEASE_TAG#v}
          manifests=$(mktemp -d)
          trap 'rm -rf "$manifests"' EXIT
          changed=()
          targets=(windows-amd64 windows-arm64)
          if [[ "$SOTTO_MACOS_RELEASE" == true ]]; then
            targets+=(darwin-arm64)
          fi
          for target in "${targets[@]}"; do
            archive="sotto-$version-$target.tar.gz"
            manifest="update-$target.json"
            if [[ "$target" == windows-* ]]; then
              installer="sotto-setup-$version-${target#windows-}.exe"
            else
              installer="sotto-$version-arm64.dmg"
            fi
            for asset in "$installer" "$archive" "$manifest"; do
              if ! jq -e --arg name "$asset" 'any(.assets[]; .name == $name and .state == "uploaded" and .size > 0)' <<< "$release" > /dev/null; then
                echo "Missing or incomplete asset $asset." >&2
                exit 1
              fi
            done

            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$manifest" --dir "$manifests"
            archive_size=$(jq --arg name "$archive" '.assets[] | select(.name == $name) | .size' <<< "$release")
            archive_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$archive"
            if ! jq -e --arg version "$version" --arg url "$archive_url" --argjson size "$archive_size" \
              '.version == $version and .url == $url and .size == $size' "$manifests/$manifest" > /dev/null; then
              echo "$manifest does not match $archive." >&2
              exit 1
            fi
            if ! jq -e --arg notes "$notes" '(.notes // "") == $notes' "$manifests/$manifest" > /dev/null; then
              jq --arg notes "$notes" '.notes = $notes' "$manifests/$manifest" > "$manifests/$manifest.tmp"
              mv "$manifests/$manifest.tmp" "$manifests/$manifest"
              changed+=("$manifests/$manifest")
            fi
          done
          if (( ${#changed[@]} )); then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${changed[@]}"
            mkdir "$manifests/verified"
            for manifest in "${changed[@]}"; do
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern "${manifest##*/}" --dir "$manifests/verified"
              cmp "$manifest" "$manifests/verified/${manifest##*/}"
            done
          fi
          current=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body,isDraft)
          if ! jq -e --argjson original "$release" '.isDraft and (.body // "") == ($original.body // "")' <<< "$current" > /dev/null; then
            echo "Release notes or draft status changed during synchronization; run this workflow again." >&2
            exit 1
          fi
      - name: Publish draft as Latest
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft=false --latest
